<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cleanup for X icon</title>
  <style>
    /* Знак расширения: тёплый терракотовый квадрат со скруглением и монограмма
       CX, как в шапке попапа. Рендерится в PNG без фона на нужный размер. */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .mark {
      width: 100%;
      height: 100%;
      border-radius: var(--radius);
      background:
        radial-gradient(120% 85% at 22% 0%, rgba(255, 253, 248, .28), transparent 58%),
        linear-gradient(145deg, #d97757 0%, #c96442 52%, #a94e31 100%);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 var(--edge) rgba(255, 253, 248, .16),
        inset 0 calc(var(--size) * .03) calc(var(--size) * .07) rgba(255, 253, 248, .18);
    }
    .mark::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(130% 95% at 50% 118%, rgba(36, 26, 22, .20), transparent 62%);
    }
    .mark span {
      position: relative;
      z-index: 1;
      color: #fffdf8;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      font-weight: 800;
      line-height: 1;
      letter-spacing: var(--track);
      text-shadow: var(--shadow);
      transform: translateY(calc(var(--size) * -.012));
    }
  </style>
</head>
<body>
  <div class="mark"><span>CX</span></div>
  <script>
    const размер = Number(new URLSearchParams(location.search).get('size')) || 128;
    const корень = document.documentElement.style;
    корень.setProperty('--size', размер + 'px');
    корень.setProperty('--radius', Math.round(размер * 0.30) + 'px');
    корень.setProperty('--edge', Math.max(1, Math.round(размер * 0.008)) + 'px');
    // На 16 px тень только размывает буквы: убираем её и даём чуть больше места.
    const мелкий = размер <= 24;
    корень.setProperty('--track', (мелкий ? 0.8 : размер * 0.006) + 'px');
    корень.setProperty('--shadow', мелкий
      ? 'none'
      : `0 ${(размер * .012).toFixed(2)}px ${(размер * .03).toFixed(2)}px rgba(36,26,22,.22)`);
    const доля = мелкий ? 0.525 : (размер <= 48 ? 0.470 : 0.455);
    document.querySelector('.mark span').style.fontSize = (размер * доля) + 'px';
  </script>
</body>
</html>
